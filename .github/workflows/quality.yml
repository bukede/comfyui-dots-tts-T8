name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<9"
      - run: python -m pytest -q tests/test_registry_metadata.py
      - run: python -m compileall -q __init__.py nodes_v3.py runtime dots_tts dots_tts_t8 scripts
