name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        numpy-version: ["1.26.4", "2.2.6"]
    steps:
      - name: Check out node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned ComfyUI V3 API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/ComfyUI
          ref: 3216c62e9962c3babd28a4dfea6e5aef50b8fe16
          path: _comfyui
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.0.3,<10" "ruff>=0.15,<0.16" "numpy==${{ matrix.numpy-version }}" "scipy==1.15.3" "librosa==0.11.0" -r requirements.txt
          python -m pip install "torch==2.8.0" "torchaudio==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==5.16.1" "huggingface-hub==1.29.0" "tokenizers==0.23.1" "safetensors==0.8.0"
          python -m pip install "av==17.0.0" "comfy-aimdo==0.4.15" "pydantic==2.12.5" "pillow==11.3.0"
          python -m pip check
      - name: Run all tests and require real ComfyUI schema coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/_comfyui
          T8_REQUIRE_COMFY_API: "1"
        run: python -m pytest -q tests
      - run: python -m ruff check __init__.py nodes_v3.py runtime dots_tts dots_tts_t8 scripts tests
      - run: python -m compileall -q __init__.py nodes_v3.py runtime dots_tts dots_tts_t8 scripts
