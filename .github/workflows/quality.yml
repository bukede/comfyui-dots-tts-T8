name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out pinned ComfyUI V3 API
        run: git clone --filter=blob:none --no-checkout https://github.com/Comfy-Org/ComfyUI.git ../ComfyUI && git -C ../ComfyUI checkout 62b3c94bd45154f6486c7abf1b9efcacee96ea69
      - name: Install test-only dependencies
        run: |
          python -m pip install "pytest>=8,<9" "ruff>=0.15,<0.16" -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pydantic numpy pillow
      - name: Run all tests and require real ComfyUI schema coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/../ComfyUI
          T8_REQUIRE_COMFY_API: "1"
        run: python -m pytest -q tests
      - run: python -m ruff check __init__.py nodes_v3.py runtime dots_tts_t8 scripts tests
      - run: python -m compileall -q __init__.py nodes_v3.py runtime dots_tts dots_tts_t8 scripts
