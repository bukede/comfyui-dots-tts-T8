name: Publish tagged node to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing immutable release tag, for example v0.6.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment: comfy-registry
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/$RELEASE_REF:refs/tags/$RELEASE_REF"
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$RELEASE_REF" = "v$PACKAGE_VERSION"
          test "$(gh release view "$RELEASE_REF" --json isDraft --jq .isDraft)" = "false"
      - name: Install pinned Registry client
        run: python -m pip install "comfy-cli==1.19.0"
      - name: Validate Registry package
        run: comfy node validate
      - name: Publish exact release
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REGISTRY_ACCESS_TOKEN"
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
