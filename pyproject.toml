[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dots-tts-t8"
version = "0.5.0"
description = "ComfyUI V3 nodes for official dots.tts checkpoints by T8star-Aix"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "T8star-Aix" }]
keywords = [
    "comfyui",
    "dots.tts",
    "tts",
    "asr",
    "speaker-diarization",
    "subtitles",
    "voice-cloning",
    "audio",
]
dependencies = [
    "huggingface-hub>=0.26",
    "hf-xet>=1.6",
    "einops>=0.8",
    "langcodes[data]",
    "librosa>=0.11.0",
    "lingua-language-detector",
    "loguru",
    "PyYAML>=6.0.3",
    "safetensors>=0.8.0rc0",
    "soundfile>=0.13.1",
    "torchdiffeq",
    "tqdm",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/T8mars/comfyui-dots-tts-T8"
Documentation = "https://github.com/T8mars/comfyui-dots-tts-T8#readme"
Issues = "https://github.com/T8mars/comfyui-dots-tts-T8/issues"
Upstream = "https://github.com/studio-dots-ai/dots.tts"
Models = "https://huggingface.co/collections/dots-studio/dotstts"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "dots.tts · T8star-Aix"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
